services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: hps
      POSTGRES_PASSWORD: hps_dev_password
      POSTGRES_DB: hybrid_party_show
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - hps_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hps -d hybrid_party_show"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  hps_pg:
